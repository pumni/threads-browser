[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "threads-browser"
version = "0.1.0"
description = "Independent read-only Threads Browser account and nurture services"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["playwright==1.63.0"]

[project.scripts]
tb = "threads_browser.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.uv.build-backend]
module-name = "threads_browser"

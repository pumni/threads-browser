name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python scripts/check_structure.py
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: uv run playwright install chromium
      - if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tests/windows/test_scheduled_runner.ps1
      - if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q --maxfail=1
      - if: runner.os == 'Windows'
        run: uv run pytest -q --maxfail=1
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            diff_base="origin/$GITHUB_BASE_REF"
          else
            diff_base="HEAD^"
          fi
          git diff --check "$diff_base...HEAD"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $diffBase = "origin/$env:GITHUB_BASE_REF"
          } else {
            $diffBase = 'HEAD^'
          }
          git diff --check "$diffBase...HEAD"
